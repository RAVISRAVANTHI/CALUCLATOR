<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Calculator</title>
    <link rel="stylesheet" href="calci.css">
</head>
<body>

<div class="app-container">

    <!-- Settings Panel -->
    <div class="sidebar">
        <h2>Theme</h2>
        <select id="themeSelector" onchange="changeTheme()">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
            <option value="neon">Neon</option>
            <option value="classic">Classic</option>
        </select>
        <button class="copy-btn" onclick="copyResult()"> Copy output 📋</button>
        <h2>History</h2>
        <ul id="historyList"></ul>
        <button onclick="clearHistory()">Clear All History</button>

        <h2>Feedback</h2>
        <textarea id="feedbackInput" placeholder="Your feedback..."></textarea>
        <button onclick="sendFeedback()">Send</button>
        <div id="feedbackStatus"></div>
    </div>

    <!-- Calculator Section -->
    <div class="calculator">
        <div class="display-section">
            <input type="text" id="display" readonly>
        </div>
        
        <div class="buttons">
            <button onclick="clearDisplay()">C</button>
            <button onclick="appendValue('/')">/</button>
            <button onclick="appendValue('*')">*</button>
            <button onclick="deleteLast()">⌫</button>
    
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('-')">-</button>
    
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('+')">+</button>
    
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="calculateResult()">=</button>
    
            <button onclick="appendValue('0')" class="zero">0</button>
            <button onclick="appendValue('.')">.</button>

            <!-- Math Functions -->
            <button onclick="calculateFactorial()">x!</button>
            <button onclick="calculateSquare()">x²</button>
            <button onclick="calculateRoot()">√x</button>

            <!-- Trigonometric Functions (angles in degrees) -->
           <button onclick="calculateSin()">sin</button>
           <button onclick="calculateCos()">cos</button>
           <button onclick="calculateTan()">tan</button>


        </div>
    </div>
    
</div>

<script src="calci.js"></script>
</body>
</html>
